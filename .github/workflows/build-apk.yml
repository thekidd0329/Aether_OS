name: Build Real AetherOS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare native Android launcher
        run: node scripts/setup-apk.mjs

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
          
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/AetherOS-Launcher.apk
          ls -lh ../artifacts/AetherOS-Launcher.apk

      - name: Upload Real AetherOS APK
        uses: actions/upload-artifact@v4
        with:
          name: AetherOS-Launcher-APK
          path: artifacts/AetherOS-Launcher.apk
          if-no-files-found: error
          retention-days: 30
